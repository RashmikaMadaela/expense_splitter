<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Splitter</title>
    <script>
      // Applied before CSS paints so a stored theme choice doesn't flash the
      // wrong colors first. Kept inline and outside the React bundle so it
      // runs synchronously, ahead of the stylesheet.
      (function () {
        try {
          var t = localStorage.getItem('expense-splitter/theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
